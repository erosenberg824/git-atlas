[tools]
rust = "1.88.0"
node = "22.19.0"

[env]
RUST_LOG = "git_atlas=debug,tower_http=debug"
# Point Cargo to the workspace root
CARGO_MANIFEST_DIR = "{{config_root}}"
# Fixed dev port: the server rebinds this on every restart, so Vite's proxy
# target (which reads ATLAS_PORT first) stays valid across server rebuilds —
# otherwise a random port on restart would break the proxy until Vite restarts.
ATLAS_PORT = "7842"

[tasks.dev-server]
description = "Run the Rust backend server in watch mode (requires cargo-watch)"
run = "cargo watch -x 'run --bin git-atlas -- --no-browser'"

[tasks.run-server]
description = "Run the Rust backend server (no watch; no auto-open — use Vite at :1420)"
run = "cargo run --bin git-atlas -- --no-browser"

[tasks.dev-ui]
description = "Run the Vite dev server for the frontend"
run = "npm run dev"
dir = "{{config_root}}/ui"

[tasks.dev]
description = "Run backend and frontend concurrently"
run = "mise run dev-server & mise run dev-ui"

[tasks.tauri-dev]
description = "Run the Tauri app in development mode"
run = "npm run tauri dev"
dir = "{{config_root}}/ui"

[tasks.build]
description = "Build the full project (server sidecar + Tauri app)"
run = "{{config_root}}/scripts/prepare-sidecar.sh && npm run tauri build"
dir = "{{config_root}}/ui"

[tasks.test]
description = "Run all tests (Rust + frontend)"
run = "mise run test-server && mise run test-ui"

[tasks.test-server]
description = "Run the Rust test suite"
run = "cargo test --workspace"

[tasks.test-ui]
description = "Run the frontend (Vitest) test suite"
run = "npm test"
dir = "{{config_root}}/ui"

[tasks.coverage-ui]
description = "Frontend test coverage (Vitest + v8)"
run = "npm test -- --coverage"
dir = "{{config_root}}/ui"

[tasks.coverage-server]
description = "Rust test coverage (requires: cargo install cargo-llvm-cov)"
run = "cargo llvm-cov --workspace --summary-only"

[tasks.lint]
description = "Run clippy and frontend linter"
run = "cargo clippy --workspace -- -D warnings && npm run lint"
dir = "{{config_root}}/ui"
