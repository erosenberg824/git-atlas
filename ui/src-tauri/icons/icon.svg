<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <!-- rounded-square backdrop matching the app's dark theme -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#30363d" stroke-width="8"/>

  <!-- commit DAG: a trunk (left lane) with a branch that forks off and merges back -->
  <g stroke-linecap="round" fill="none">
    <!-- trunk edge -->
    <path d="M176 128 V384" stroke="#58a6ff" stroke-width="20"/>
    <!-- branch out -->
    <path d="M176 208 C 176 264, 336 248, 336 304" stroke="#3fb950" stroke-width="20"/>
    <!-- branch merge back -->
    <path d="M336 304 C 336 352, 176 336, 176 384" stroke="#3fb950" stroke-width="20"/>
  </g>

  <!-- commit nodes on the trunk -->
  <g>
    <circle cx="176" cy="128" r="34" fill="#0d1117" stroke="#58a6ff" stroke-width="18"/>
    <circle cx="176" cy="256" r="34" fill="#0d1117" stroke="#58a6ff" stroke-width="18"/>
    <circle cx="176" cy="384" r="34" fill="#0d1117" stroke="#58a6ff" stroke-width="18"/>
    <!-- branch commit node -->
    <circle cx="336" cy="304" r="34" fill="#0d1117" stroke="#3fb950" stroke-width="18"/>
  </g>
</svg>
