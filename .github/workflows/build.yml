name: build

# CI/CD pipeline:
#  - `test` runs the Rust + frontend suites (with coverage) on every push/PR.
#  - the 3-OS `build` jobs depend on `test` (needs: test) so nothing is built or
#    released unless tests pass. To avoid a slow 3-OS build on every commit, the
#    build only runs on version tags (v*) or manual dispatch — but always gated
#    on green tests.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the release job to create releases / upload assets.
permissions:
  contents: write

jobs:
  # ── Fast test suite (runs on every push/PR; gates the build) ─────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise (pinned Rust + Node)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Rust build cache (smarter than actions/cache for target dirs, incl. the
      # llvm-cov instrumented build).
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Scope the cache to the server crate's build.
          workspaces: "server -> target"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Cover only the server crate (`git-atlas`) — the git/graph logic worth
      # testing. This deliberately skips the Tauri app crate (`git-atlas-app`),
      # which would otherwise force compiling the whole GTK/WebKit + wry stack
      # and require the bundled sidecar binary to exist. (The app crate's logging
      # tests still run in local `cargo test`.)
      - name: Rust tests with coverage
        run: cargo llvm-cov -p git-atlas --lcov --output-path lcov-rust.info

      - name: Install frontend deps
        working-directory: ui
        run: npm ci

      - name: Frontend tests with coverage
        working-directory: ui
        run: npm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          if-no-files-found: warn
          path: |
            lcov-rust.info
            ui/coverage/**

  build:
    # Only build/release when tests pass. Skip the slow 3-OS build on ordinary
    # pushes — build on tags or manual dispatch (still gated on `test`).
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Universal build → one .app/.dmg that runs on both Apple Silicon
            # and Intel Macs. Requires staging the sidecar for both arches.
            rust_target: universal-apple-darwin
            sidecar_targets: "aarch64-apple-darwin x86_64-apple-darwin"
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            sidecar_targets: "x86_64-unknown-linux-gnu"
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            sidecar_targets: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Linux system dependencies for Tauri/WebKitGTK ──────────────────────
      # (macOS and Windows ship the needed webview support.)
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libssl-dev

      # ── Toolchain: use mise so CI matches the pinned local versions ────────
      - name: Set up mise (pinned Rust + Node)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Rust build cache keyed on the workspace + OS.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Ensure Rust targets are installed
        shell: bash
        run: |
          set -euo pipefail
          for t in ${{ matrix.sidecar_targets }}; do
            rustup target add "$t"
          done

      # ── Prepare the sidecar: build the release `git-atlas` server for each
      # required arch and place it where Tauri's externalBin expects it, named
      # with the target triple. For the macOS universal build this stages BOTH
      # aarch64 and x86_64 slices (Tauri needs a sidecar per arch to lipo them).
      # `shell: bash` runs on all three runners (Git Bash on Windows).
      - name: Build & stage server sidecar
        shell: bash
        run: |
          set -euo pipefail
          EXT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then EXT=".exe"; fi

          # The UI must be built before the server so rust-embed embeds it.
          (cd ui && npm run build)

          mkdir -p ui/src-tauri/binaries
          for TRIPLE in ${{ matrix.sidecar_targets }}; do
            echo "==> building sidecar for $TRIPLE"
            cargo build --release --bin git-atlas --target "$TRIPLE"
            cp "target/${TRIPLE}/release/git-atlas${EXT}" \
               "ui/src-tauri/binaries/git-atlas-${TRIPLE}${EXT}"
          done

          # For the macOS universal build, the Tauri bundler expects a SINGLE
          # sidecar named with the `universal-apple-darwin` triple (not the two
          # per-arch files). Combine the arch slices with lipo.
          if [[ "${{ matrix.rust_target }}" == "universal-apple-darwin" ]]; then
            echo "==> lipo-ing universal sidecar"
            lipo -create \
              "ui/src-tauri/binaries/git-atlas-aarch64-apple-darwin" \
              "ui/src-tauri/binaries/git-atlas-x86_64-apple-darwin" \
              -output "ui/src-tauri/binaries/git-atlas-universal-apple-darwin"
            chmod +x "ui/src-tauri/binaries/git-atlas-universal-apple-darwin"
            lipo -info "ui/src-tauri/binaries/git-atlas-universal-apple-darwin"
          fi

      # ── Build & bundle the Tauri app (also creates the Release on tags) ────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tauri.conf.json lives under ui/src-tauri; the frontend is in ui.
          projectPath: ui
          args: --target ${{ matrix.rust_target }}
          # On a v* tag, create/append to a release named after the tag.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseDraft: false
          prerelease: false

      # ── Upload installers as workflow artifacts (every build) ──────────────
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-atlas-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.rust_target }}/release/bundle/macos/*.app
            target/${{ matrix.rust_target }}/release/bundle/deb/*.deb
            target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
